<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espace Vendeur - SHOWCASE ITACHI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <a href="index.html" class="back-link">← Retour Accueil</a>
        <div style="display: flex; align-items: center; gap: 10px;">
            <span style="font-size: 0.85rem; color: rgba(255,255,255,0.6);">Showcase Itachi 20/11</span>
            <span class="ws-status" id="ws-status" title="Statut temps réel"></span>
        </div>
    </header>

    <div class="container">
        <h2>Espace Vendeur</h2>
        
        <div id="alert-box" class="alert"></div>

        <div class="card">
            <div class="form-group">
                <label for="vendor-select">Sélectionnez votre nom :</label>
                <select id="vendor-select" class="form-control">
                    <option value="">-- Choisissez --</option>
                </select>
            </div>
        </div>

        <div id="vendor-dashboard" class="card" style="display: none;">
            <div style="display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px;">
                <h3 id="vendor-name-display" style="margin-bottom: 4px;">Nom du vendeur</h3>
                <span id="vendor-revenue" style="color: var(--success); font-weight: 900; font-size: 1.1rem;">0 DH</span>
            </div>
            
            <div id="vendor-souches-display" class="souche-badge-list"></div>

            <p style="margin-top: 8px;">Ventes : <strong id="vendor-sales">0</strong> / <span id="vendor-quota">0</span> tickets</p>
            <div class="progress-container">
                <div class="progress-bar" id="vendor-progress"></div>
            </div>

            <!-- Détail individuel des souches -->
            <div id="vendor-souches-detail" class="souche-breakdown" style="margin-top: 15px;"></div>
            
            <div class="form-group" style="margin-top: 20px;">
                <label for="sell-quantity">Nombre de ticket vendu :</label>
                <input type="number" id="sell-quantity" class="form-control" value="1" min="1">
            </div>
            <button id="btn-sell" class="btn btn-primary" style="width: 100%;">Enregistrer la vente</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
</body>
</html>
