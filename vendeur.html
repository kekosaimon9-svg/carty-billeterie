<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espace Vendeur - SHOWCASE CARTY</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <a href="index.html" class="back-link">← Retour Accueil</a>
        <div><span class="ws-status" id="ws-status" title="Statut temps réel"></span></div>
    </header>

    <div class="container">
        <h2>Espace Vendeur</h2>
        
        <div id="alert-box" class="alert"></div>

        <div class="card">
            <div class="form-group">
                <label for="vendor-select">Sélectionnez votre nom :</label>
                <select id="vendor-select" class="form-control">
                    <option value="">-- Choisissez --</option>
                </select>
            </div>
        </div>

        <div id="vendor-dashboard" class="card" style="display: none;">
            <h3 id="vendor-name-display">Nom du vendeur</h3>
            <p>Ventes : <strong id="vendor-sales">0</strong> / <span id="vendor-quota">0</span></p>
            <div class="progress-container">
                <div class="progress-bar" id="vendor-progress"></div>
            </div>
            
            <div class="form-group" style="margin-top: 20px;">
                <label for="sell-quantity">Quantité à vendre :</label>
                <input type="number" id="sell-quantity" class="form-control" value="1" min="1">
            </div>
            <button id="btn-sell" class="btn btn-primary" style="width: 100%;">Enregistrer la vente</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
</body>
</html>
