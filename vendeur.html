<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espace Vendeur - SHOWCASE ITACHI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <a href="index.html" class="back-link">← Retour Accueil</a>
        <div style="display: flex; align-items: center; gap: 10px;">
            <span style="font-size: 0.85rem; color: rgba(255,255,255,0.6);">Showcase Itachi 20/11</span>
            <span class="ws-status" id="ws-status" title="Statut temps réel"></span>
        </div>
    </header>

    <div class="container">
        <h2>Espace Vendeur</h2>
        
        <div id="alert-box" class="alert"></div>

        <div class="card">
            <div class="form-group">
                <label for="vendor-select">Sélectionnez votre nom :</label>
                <select id="vendor-select" class="form-control">
                    <option value="">-- Choisissez --</option>
                </select>
            </div>
        </div>

        <div id="vendor-dashboard" class="card" style="display: none;">
            <div style="display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px;">
                <h3 id="vendor-name-display" style="margin-bottom: 0;">Nom du vendeur</h3>
                <span id="vendor-revenue" style="color: var(--success); font-weight: 900; font-size: 1.25rem;">0 DH</span>
            </div>

            <!-- Jauge ultra stylée -->
            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 16px; margin-bottom: 6px;">
                <span style="font-size: 0.95rem; color: rgba(255,255,255,0.85);">
                    Tickets vendus : <strong id="vendor-sales" style="color: #fff; font-size: 1.15rem;">0</strong> / <span id="vendor-quota">0</span>
                </span>
                <span class="gauge-percent-badge" id="vendor-percent-badge">0%</span>
            </div>

            <div class="progress-container" style="height: 18px;">
                <div class="progress-bar" id="vendor-progress"></div>
            </div>

            <div style="display: flex; justify-content: space-between; font-size: 0.85rem; color: rgba(255,255,255,0.5); margin-top: 6px;">
                <span>0 ticket</span>
                <span id="vendor-remaining-text" style="color: #ff858e; font-weight: 600;">0 restant</span>
                <span id="vendor-quota-max">Max: 0</span>
            </div>
            
            <div class="form-group" style="margin-top: 24px;">
                <label for="sell-quantity">Nombre de ticket vendu :</label>
                <input type="number" id="sell-quantity" class="form-control" value="1" min="1">
            </div>
            <button id="btn-sell" class="btn btn-primary" style="width: 100%;">Enregistrer la vente</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
</body>
</html>
